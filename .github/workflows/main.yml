name: Build LaTeX document

on: 
  push:
  pull_request:
    types:
      - closed
    branches:
      - main



jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document ControlTheoryRecap
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: SlidesRU/ControlTheoryRecap/

      - name: Compile LaTeX document StabilityCertificates
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: SlidesRU/StabilityCertificates/

      - name: Compile LaTeX document SoS
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: SlidesRU/SoS/

      - name: Compile LaTeX document SoSLyapunov
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: SlidesRU/SoSLyapunov/

      - name: Compile LaTeX document TrajectoryPlanning
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: SlidesRU/TrajectoryPlanning/

      - name: Compile LaTeX document ShootingCollocation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: SlidesRU/ShootingCollocation/





      - name: Save ControlTheoryRecap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlTheoryRecap.pdf
          path: SlidesRU/ControlTheoryRecap/main.pdf

      - name: Save StabilityCertificates artifact
        uses: actions/upload-artifact@v4
        with:
          name: StabilityCertificates.pdf
          path: SlidesRU/StabilityCertificates/main.pdf

      - name: Save SoS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoS.pdf
          path: SlidesRU/SoS/main.pdf

      - name: Save SoSLyapunov artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoSLyapunov.pdf
          path: SlidesRU/SoSLyapunov/main.pdf

      - name: Save TrajectoryPlanning artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrajectoryPlanning.pdf
          path: SlidesRU/TrajectoryPlanning/main.pdf

      - name: Save ShootingCollocation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShootingCollocation.pdf
          path: SlidesRU/ShootingCollocation/main.pdf



      - name: Update compiled PDFs in git repository
        if: github.event.pull_request.merged == true || github.event_name == 'push'
        run: |
          mv SlidesRU/ControlTheoryRecap/main.pdf SlidesRU/ControlTheoryRecap.pdf
          mv SlidesRU/StabilityCertificates/main.pdf SlidesRU/StabilityCertificates.pdf
          mv SlidesRU/SoS/main.pdf SlidesRU/SoS.pdf
          mv SlidesRU/SoSLyapunov/main.pdf SlidesRU/SoSLyapunov.pdf
          mv SlidesRU/TrajectoryPlanning/main.pdf SlidesRU/TrajectoryPlanning.pdf
          mv SlidesRU/ShootingCollocation/main.pdf SlidesRU/ShootingCollocation.pdf



          git config --global user.name 'CI PDF compiler'
          git config --global user.email '<>'
          git add SlidesRU/ControlTheoryRecap.pdf
          git add SlidesRU/StabilityCertificates.pdf
          git add SlidesRU/SoS.pdf
          git add SlidesRU/SoSLyapunov.pdf
          git add SlidesRU/TrajectoryPlanning.pdf
          git add SlidesRU/ShootingCollocation.pdf



          git commit -m "Update compiled PDFs"
          git push
