name: Build LaTeX document

on: 
  push:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        
      - name: Compile LaTeX document - Control Theory Recap
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: Slides\ RU/Control\ Theory\ Recap/
          
      - name: Save Control Theory Recap artifact
        uses: actions/upload-artifact@v4
        with:
          name: Control_Theory_Recap.pdf
          path: Slides\ RU/Control\ Theory\ Recap/main.pdf
          
      - name: Update compiled PDF in git repository
        if: github.event.pull_request.merged == true || github.event_name == 'push'
        run: |
          mv "Slides RU/Control Theory Recap/main.pdf" "Slides RU/Control Theory Recap.pdf"
          git config --global user.name 'CI PDF compiler'
          git config --global user.email '<>'
          git add "Slides RU/Control Theory Recap.pdf"
          git commit -m "Update compiled PDF - Control Theory Recap"
          git push